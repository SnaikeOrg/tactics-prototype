<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tactics-prototype</title>
    <style>
      :root {
        --tile-size: 84px;
        font-family: system-ui, sans-serif;
        font-size: 11px;
      }
      body {
        margin: 16px;
        background: #f4f4f4;
        color: #111;
      }
      .board {
        display: grid;
        gap: 2px;
        width: max-content;
      }
      .tile {
        position: relative;
        width: var(--tile-size);
        height: var(--tile-size);
        box-sizing: border-box;
        padding: 3px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .terrain {
        opacity: 0.7;
      }
      .terrain-ground {
        background: #e2dccb;
      }
      .terrain-forest {
        background: #7fae7a;
      }
      .terrain-high-ground {
        background: #c9a66b;
      }
      .terrain-wall {
        background: #444;
        color: #eee;
      }
      .unit {
        display: flex;
        flex-direction: column;
        padding: 2px;
        border-radius: 3px;
        color: #fff;
      }
      .unit-player {
        background: #2a5bd7;
      }
      .unit-enemy {
        background: #c62828;
      }
      .unit-active {
        outline: 3px solid #ffd400;
        outline-offset: 1px;
      }
      .tile-movable {
        cursor: pointer;
        box-shadow: inset 0 0 0 3px #2a5bd7;
      }
      .hud {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .initiative {
        display: flex;
        gap: 6px;
      }
      .initiative-active {
        font-weight: bold;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="app">booting</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
